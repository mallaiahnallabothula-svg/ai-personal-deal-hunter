<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid border -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Status pill -->
  <g transform="translate(80, 100)">
    <rect width="320" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="19" r="5" fill="#38bdf8"/>
    <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">CONSUMER INTELLIGENCE</text>
  </g>

  <!-- Brand Title -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    AI Personal Deal Hunter
  </text>

  <!-- Tagline -->
  <text x="80" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#38bdf8">
    Know when a deal is actually worth checking.
  </text>

  <!-- Description -->
  <text x="80" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Independent shopping education, price history analysis, and deal verification for India.
  </text>

  <!-- Bottom trust labels -->
  <g transform="translate(80, 500)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">
      Evidence-First · Zero-Cost Static Architecture · No Sponsored Placement
    </text>
  </g>
</svg>
